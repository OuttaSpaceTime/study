[project]
name = "study-wiki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
dev-dependencies = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
