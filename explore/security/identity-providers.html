function buildSilentCheck(root, saved = {}) {
  const BROWSERS = [
    { id: "chrome", name: "Chrome", note: "third-party cookies on by default" },
    { id: "safari", name: "Safari", note: "third-party cookies blocked" },
    { id: "firefox", name: "Firefox", note: "third-party cookies partitioned" },
    { id: "brave", name: "Brave", note: "third-party cookies blocked" }
  ];
  const METHODS = [
    { id: "backend", name: "Your backend asks Auth0", how: "A server-to-server call from app.example.com's backend to Auth0." },
    { id: "iframe", name: "Hidden iframe, prompt=none", how: "Your page loads your-tenant.auth0.com/authorize?prompt=none in an invisible iframe." },
    { id: "custom", name: "Hidden iframe on a custom domain", how: "The same iframe, but Auth0 runs on login.example.com, the same site as app.example.com." },
    { id: "top", name: "Whole page redirect, prompt=none", how: "On page load, the whole tab navigates to Auth0 with prompt=none and straight back." }
  ];
  let session = true, revealed = false, sel = { m: "iframe", b: "safari" };

  // What happens for one method in one browser.
  function outcome(m, b) {
    if (m === "backend") return { kind: "na", short: "? can't ask",
      cookie: "No cookie at all: Auth0's cookie lives in the browser, not on your server.",
      result: "Auth0 has no idea which browser or user you mean. There is no API that answers 'does this browser have a session?'.",
      frame: "server" };
    const thirdParty = m === "iframe";
    const blocked = thirdParty && b !== "chrome";
    let cookie;
    if (m === "top") cookie = "Sent. The whole tab is on Auth0's site, so Auth0's cookie is first-party.";
    else if (m === "custom") cookie = "Sent. login.example.com and app.example.com are the same site, so the cookie is not third-party.";
    else if (b === "chrome") cookie = "Sent. Inside your page Auth0's cookie is third-party, and Chrome still sends those by default.";
    else if (b === "firefox") cookie = "Not found. Firefox keeps a separate cookie jar per top-level site; the jar for app.example.com never got Auth0's login cookie.";
    else cookie = `Blocked. Inside your page Auth0's cookie is third-party, and ${b === "safari" ? "Safari" : "Brave"} blocks those.`;
    const sees = session && !blocked;
    const result = sees
      ? (m === "top" ? "Auth0 finds the session and redirects back with a code. The user sees a quick flicker on page load, then is signed in."
                     : "Auth0 finds the session and posts a code back to your page. Signed in without anything visible.")
      : (blocked ? "Auth0 sees no cookie, so as far as it knows there is no session: error=login_required, although the user is logged in at Auth0."
                 : (m === "top" ? "No Auth0 session: the tab comes back with error=login_required, and your app shows its own Login button."
                                : "No Auth0 session: error=login_required. Your app shows its own Login button."));
    return { kind: sees ? "yes" : "no", short: sees ? "✓ signed in" : "✕ login_required", cookie, result, frame: m === "top" ? "top" : "iframe", blocked };
  }

  const prose = el("p", { class: "prose" });
  prose.innerHTML = "Your app wants to skip the Login click when Auth0 still has a session. There are three ways to ask without showing a login screen. Your backend can ask, a hidden iframe can ask with <code>prompt=none</code>, or the whole page can hop to Auth0 and straight back. It works only if the browser sends Auth0's cookie.";

  const sessBtns = [[true, "Auth0 session alive"], [false, "Auth0 session expired"]].map(([v, label]) =>
    el("button", { class: "seg", type: "button", "aria-pressed": String(v === session), "data-v": String(v),
      onclick: () => { session = v; sessBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(session)))); paint(); } }, label));
  const grid = el("div", { class: "matrix-wrap" });
  const detail = el("div", { class: "detail" });
  const lock = el("div", { class: "lock-note" }, "Click any cell to see where the request goes. The results appear after your prediction below.");

  function frameDiagram(o, m) {
    const ck = !revealed ? el("span", { class: "cookie none" }, "auth0 cookie: ?")
      : el("span", { class: "cookie " + (o.kind === "na" ? "none" : (o.blocked ? "blocked" : "sent")) },
        o.kind === "na" ? "auth0 cookie: not here" : (o.blocked ? "auth0 cookie: ✕ not sent" : "auth0 cookie: ✓ sent"));
    if (o.frame === "server") return el("div", { class: "frame server" },
      el("div", { class: "frame-bar mono" }, "app.example.com backend → your-tenant.auth0.com"), el("div", { class: "frame-in" }, ck));
    const auth0Host = m === "custom" ? "login.example.com" : "your-tenant.auth0.com";
    if (o.frame === "top") return el("div", { class: "frame" },
      el("div", { class: "frame-bar mono" }, `${auth0Host}/authorize?prompt=none…`),
      el("div", { class: "frame-in" }, el("span", { class: "frame-label" }, "The whole tab is on Auth0 for a moment"), ck));
    return el("div", { class: "frame" },
      el("div", { class: "frame-bar mono" }, "app.example.com"),
      el("div", { class: "frame-in" }, el("span", { class: "frame-label" }, "Your page"),
        el("div", { class: "frame inner" }, el("div", { class: "frame-bar mono" }, `iframe: ${auth0Host}/authorize?prompt=none…`),
          el("div", { class: "frame-in" }, ck))));
  }

  function paint() {
    const table = el("table", { class: "matrix" },
      el("thead", {}, el("tr", {}, el("th", { scope: "col" }, ""), BROWSERS.map(b => el("th", { scope: "col" }, b.name, el("span", { class: "th-note" }, b.note))))),
      el("tbody", {}, METHODS.map(m => el("tr", {}, el("th", { scope: "row" }, m.name),
        BROWSERS.map(b => {
          const o = outcome(m.id, b.id);
          const on = sel.m === m.id && sel.b === b.id;
          return el("td", {}, el("button", { class: `cell ${revealed ? o.kind : "hidden"}${on ? " on" : ""}`, type: "button", "aria-pressed": String(on),
            "aria-label": `${m.name} in ${b.name}${revealed ? ": " + o.short : ""}`,
            onclick: () => { sel = { m: m.id, b: b.id }; paint(); } }, revealed ? o.short : "?"));
        })))));
    grid.replaceChildren(table);
    const m = METHODS.find(x => x.id === sel.m), b = BROWSERS.find(x => x.id === sel.b);
    const o = outcome(sel.m, sel.b);
    detail.replaceChildren(
      el("div", { class: "http-h" }, `${m.name} · ${b.name}`),
      el("p", { class: "detail-how" }, m.how),
      frameDiagram(o, sel.m),
      revealed ? el("p", { class: "detail-line" }, el("b", {}, "Cookie: "), o.cookie) : "",
      revealed ? el("p", { class: "detail-line" }, el("b", {}, "Result: "), o.result) : "");
    if (revealed) announce(`${m.name} in ${b.name}: ${o.short}. ${o.result}`);
  }

  const gate = predictionGate({
    scene: "s4-silent-check",
    question: "Hidden iframe with prompt=none, in Safari, while the user's Auth0 session is alive. What comes back?",
    options: [
      { id: "code", label: "A code: Auth0 sees its session and signs the user in silently" },
      { id: "loginreq", label: "login_required: Auth0 never sees its own cookie inside your page" },
      { id: "form", label: "Auth0's login form, inside the hidden iframe" },
      { id: "framed", label: "An error, because Auth0's login page refuses to be framed" }
    ],
    correct: "loginreq",
    why: "Inside your page, Auth0 is a third-party site, and Safari doesn't send third-party cookies. Auth0 sees no session and says <code>login_required</code>, although the user is logged in there. The login page's framing block doesn't matter: <code>prompt=none</code> never shows a page. Now flip through the other cells and the session switch.",
    onAnswer: () => { revealed = true; lock.hidden = true; paint(); }
  });

  root.append(prose,
    el("div", { class: "segs", role: "group", "aria-label": "Auth0 session" }, el("span", { class: "segs-label" }, "At Auth0:"), sessBtns),
    grid, detail, lock, gate);
  if (saved.sel) sel = saved.sel;
  if (typeof saved.session === "boolean") {
    session = saved.session;
    sessBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(session))));
  }
  if (saved.answer) gate.restore(saved.answer);
  paint();

  return {
    getState: () => ({ answer: gate.answer(), session, sel }),
    restoreRecord: r => gate.restore(r.answer_id || gate.byLabel(r.answer)),
    stepper: () => null,
    context: () => {
      const o = outcome(sel.m, sel.b);
      return [
        "SCENE: Why can't the app just ask Auth0 whether there's a session? (lever sandbox: 4 ways to check silently × 4 browsers, plus a switch for whether the Auth0 session is alive)",
        "PROSE: " + prose.textContent,
        `STATE: Auth0 session ${session ? "alive" : "expired"}; selected: ${METHODS.find(x => x.id === sel.m).name} in ${BROWSERS.find(x => x.id === sel.b).name}; ` +
          (revealed ? `result: ${o.short}. Cookie: ${o.cookie} ${o.result}` : "prediction not made yet")
      ].join("\n");
    }
  };
}

function buildAutoLogin(root, saved = {}) {
  const DEPTHS = [
    { id: 0, label: "Your app only" },
    { id: 1, label: "App + Auth0" },
    { id: 2, label: "App + Auth0 + Microsoft" }
  ];
  let auto = true, depth = 0, step = 0, revealed = false;

  // The story for one lever setting: Ada logs out, Ben sits down.
  function scenario() {
    const s = { app: 1, auth0: 1, ms: 1 };
    const out = [];
    const push = (who, text) => out.push({ who, text, sess: { ...s } });
    push("Ada", "Ada is logged in. All three sessions are alive.");
    s.app = 0; if (depth >= 1) s.auth0 = 0; if (depth >= 2) s.ms = 0;
    push("Ada", "Ada clicks Log out. Your backend deletes its session cookie" +
      (depth >= 1 ? " and sends the browser to Auth0's /oidc/logout, which ends the Auth0 session" : "") +
      (depth >= 2 ? ". With federated, Auth0 also sends it to Microsoft's logout" : "") + ".");
    let loop = false;
    if (auto) {
      if (s.auth0) {
        s.app = 1; loop = true;
        push("Ada", "The logout lands on your start page. Auto-login hops to Auth0 with prompt=none. Auth0 still has Ada's session, so it hands back a code: Ada is logged in again a second after logging out.");
      } else push("Ada", "The logout lands on your start page. Auto-login hops to Auth0 with prompt=none: no Auth0 session, login_required. Ada sees your Login button.");
    } else push("Ada", "The logout lands on your start page. Ada sees your Login button.");
    push("Ben", loop ? "Ada gives up and walks away with the app open. Ben sits down at the same computer." : "Ada walks away. Ben sits down at the same computer and opens the app.");
    let verdict;
    if (s.app) {
      push("Ben", "Your app's cookie is valid. Ben is in Ada's account without clicking anything.");
      verdict = { level: "danger", text: "Ben is in Ada's account with zero clicks, and Ada could never log out." };
    } else if (s.auth0) {
      push("Ben", "Ben clicks Login. Auth0 still has Ada's session: one flicker, and Ben is in Ada's account.");
      verdict = { level: "danger", text: "One click puts Ben in Ada's account. Without auto-login the hole is the same: it only adds the click." };
    } else if (s.ms) {
      if (auto) push("Ben", "Auto-login asks Auth0 with prompt=none: no Auth0 session, login_required. Ben sees the Login button.");
      push("Ben", "Ben clicks Login and picks Microsoft on Auth0's page. Microsoft still has Ada's session, so it offers Ada's account and signs in without a password.");
      verdict = { level: "risky", text: "Ben needs two clicks and has to pick Ada's account. Better, but Microsoft still remembers Ada." };
    } else {
      if (auto) push("Ben", "Auto-login asks Auth0 with prompt=none: no Auth0 session, login_required. Ben sees the Login button.");
      push("Ben", "Ben clicks Login, picks Microsoft, and Microsoft asks for a password. Ben has to use his own account.");
      verdict = { level: "ok", text: "Clean: nobody remembers Ada. The cost: Ada is also signed out of Outlook, Teams and every other Microsoft app in this browser, which is why Auth0 calls federated logout 'not recommended' outside shared machines." };
    }
    return { steps: out, verdict, loop };
  }

  const prose = el("p", { class: "prose" },
    "Auto-login means your start page hops to Auth0 with prompt=none the moment it loads, using the redirect from scene 4 that works in every browser. Log out can clear one, two or all three sessions from scene 1. The story is the same each time: Ada logs out at a shared computer, then Ben sits down.");

  const seg = (name, items, get, set) => {
    const btns = items.map(([v, label]) => el("button", { class: "seg", type: "button", "data-v": String(v), "aria-pressed": String(v === get()),
      onclick: () => { set(v); btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(get())))); steps.reset(); } }, label));
    return { row: el("div", { class: "segs", role: "group", "aria-label": name }, el("span", { class: "segs-label" }, name), btns), btns };
  };
  const autoSeg = seg("Auto-login on page load", [[false, "Off"], [true, "On"]], () => auto, v => { auto = v; });
  const depthSeg = seg("Log out clears", DEPTHS.map(d => [d.id, d.label]), () => depth, v => { depth = v; });
  const setLevers = enabled => [...autoSeg.btns, ...depthSeg.btns].forEach(b => { b.disabled = !enabled; });

  const chips = el("div", { class: "sess-chips", "aria-label": "Sessions in this browser" });
  const list = el("ol", { class: "story" });
  const verdict = el("p", { class: "verdict", hidden: true });
  const lock = el("div", { class: "lock-note" }, "The levers are set for the prediction below. Answer it to run the story and change the levers.");
  const steps = stepper({ count: () => scenario().steps.length, render: i => { step = i; paint(); } });
  const run = el("section", { class: "trace", hidden: true, "aria-label": "The shared computer, step by step" }, steps.el, list, verdict);

  function paintChips(sess) {
    chips.replaceChildren(...[["app", "Your app"], ["auth0", "Auth0"], ["ms", "Microsoft"]].map(([k, name]) =>
      el("span", { class: "sess " + (sess[k] ? "alive" : "dead"), style: `--c:${LANES[k].color}` },
        el("b", {}, name), sess[k] ? " ✓ alive" : " ✕ cleared")));
  }
  function paint() {
    const sc = scenario();
    if (!revealed) { paintChips({ app: 1, auth0: 1, ms: 1 }); return; }
    const cur = sc.steps[Math.min(step, sc.steps.length - 1)];
    paintChips(cur.sess);
    list.replaceChildren(...sc.steps.slice(0, step + 1).map((st, i) =>
      el("li", { class: i === step ? "current" : "past" },
        el("span", { class: "who " + st.who.toLowerCase() }, st.who), el("span", {}, st.text))));
    const last = step === sc.steps.length - 1;
    verdict.hidden = !last;
    verdict.className = "verdict " + (sc.verdict.level === "ok" ? "ok" : sc.verdict.level === "danger" ? "danger" : "no");
    verdict.innerHTML = `<b>${sc.verdict.level === "ok" ? "Safe." : sc.verdict.level === "danger" ? "Ada's account is exposed." : "Still risky."}</b> ${sc.verdict.text}`;
    announce(`${cur.who}: ${cur.text}`);
  }

  const gate = predictionGate({
    scene: "s5-auto-login",
    question: "Auto-login is on and Log out clears only your app's cookie. Ada logs out and leaves. Ben opens the app. Where does Ben end up?",
    options: [
      { id: "login", label: "On your Login page: he has to log in himself" },
      { id: "ada", label: "In Ada's account, without clicking anything" },
      { id: "auth0", label: "On Auth0's login page, with Ada's account suggested" },
      { id: "error", label: "On an error page, because Ada's session was logged out" }
    ],
    correct: "ada",
    why: "Logout left Auth0's session alive, so the moment the start page loads, auto-login gets Ada a fresh session. Ada can't even stay logged out herself. Now change the levers: auto-login off, then deeper logouts.",
    onAnswer: () => { revealed = true; lock.hidden = true; run.hidden = false; setLevers(true); activeStepper = steps; steps.reset(); }
  });

  root.append(prose, el("div", { class: "levers" }, autoSeg.row, depthSeg.row), chips, lock, run, gate);
  setLevers(false);
  paint();
  if (saved.answer) {
    gate.restore(saved.answer);
    if (typeof saved.auto === "boolean") autoSeg.btns.find(b => b.dataset.v === String(saved.auto)).click();
    if (saved.depth != null) depthSeg.btns.find(b => b.dataset.v === String(saved.depth)).click();
    if (saved.step) steps.go(saved.step);
  }

  return {
    getState: () => ({ answer: gate.answer(), auto, depth, step }),
    restoreRecord: r => gate.restore(r.answer_id || gate.byLabel(r.answer)),
    stepper: () => (revealed ? steps : null),
    context: () => {
      const sc = scenario();
      return [
        "SCENE: What does auto-login cost? (break it: auto-login on page load on/off × how much Log out clears; Ada logs out at a shared computer, then Ben opens the app)",
        "PROSE: " + prose.textContent,
        `STATE: auto-login ${auto ? "on" : "off"}; logout clears ${DEPTHS[depth].label}; ` +
          (revealed ? `step ${step + 1}/${sc.steps.length}: ${sc.steps[Math.min(step, sc.steps.length - 1)].text} Verdict: ${sc.verdict.text}` : "prediction not made yet")
      ].join("\n");
    }
  };
}

// ---------------------------------------------------------------------------
// Stage: one scene at a time.
// ---------------------------------------------------------------------------
const stage = document.getElementById("stage");
const dots = document.getElementById("dots");
const built = {};
let current = 0;

// The page keeps its state across republishes and reloads: where you are in this browser
// (localStorage, plus the viewer's hot-update hook), and which predictions you answered (db).
const STORE_KEY = "idp-explorable-v1";
let BOOT = { scenes: {} }, dbAnswers = {}, saveTimer = null;
function collectState() {
  const scenes = { ...(BOOT.scenes || {}) };
  for (const [id, b] of Object.entries(built)) if (b.api.getState) scenes[id] = b.api.getState();
  return { current, scenes };
}
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(collectState())); } catch (e) { /* storage unavailable */ }
  }, 50);
}
function restoreFromDb(id) {
  const b = built[id], r = dbAnswers[id];
  if (b && r && b.api.getState && !b.api.getState().answer) b.api.restoreRecord(r);
}

function showScene(i) {
  current = i;
  const sc = SCENES[i];
  if (!built[sc.id]) {
    const sec = el("section", { class: "scene", "aria-labelledby": `${sc.id}-h` });
    sec.append(el("h2", { id: `${sc.id}-h` }, sc.title));
    if (sc.build) {
      const body = el("div", { style: "display:grid;gap:18px" });
      sec.append(body);
      const api = sc.build(body, (BOOT.scenes || {})[sc.id] || {});
      sec.append(askBox(sc.id, api.context));
      built[sc.id] = { sec, api };
    } else {
      sec.append(el("p", { class: "upcoming" }, "This scene is being built. It arrives in the next turn of the session."));
      built[sc.id] = { sec, api: { stepper: () => null } };
    }
  }
  stage.replaceChildren(built[sc.id].sec);
  restoreFromDb(sc.id);
  queueSave();
  activeStepper = built[sc.id].api.stepper();
  [...dots.children].forEach((d, j) => j === i ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current"));
  document.getElementById("count").textContent = `Scene ${i + 1} of ${SCENES.length}`;
  document.getElementById("prev").disabled = i === 0;
  const nextB = document.getElementById("next");
  const pending = i < SCENES.length - 1 && !SCENES[i + 1].build;
  nextB.disabled = i === SCENES.length - 1 || pending;
  nextB.textContent = pending ? `Scene ${i + 2}: say next in Claude Code` : "Next →";
}

SCENES.forEach((sc, i) => dots.append(el("button", {
  class: "dot", type: "button", disabled: !sc.build, "aria-label": `Scene ${i + 1}: ${sc.title}${sc.build ? "" : " (coming next)"}`,
  onclick: () => showScene(i)
})));
document.getElementById("prev").addEventListener("click", () => showScene(Math.max(0, current - 1)));
document.getElementById("next").addEventListener("click", () => showScene(Math.min(SCENES.length - 1, current + 1)));

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable)) return;
  const s = built[SCENES[current].id] && built[SCENES[current].id].api.stepper();
  if (!s) return;
  if (e.key === "ArrowRight") { s.next(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { s.prev(); e.preventDefault(); }
  else if (e.key === "r" || e.key === "R") { s.replay(); }
  else if (e.key === " " && (!t || t.tagName !== "BUTTON")) { s.toggle(); e.preventDefault(); }
});

["click", "input", "change", "keydown"].forEach(t => document.addEventListener(t, queueSave));

function start(data) {
  let local = {};
  try { local = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { local = {}; }
  BOOT = data && data.scenes ? data : (local.scenes ? local : { scenes: {} });
  const want = Math.max(0, Math.min(SCENES.length - 1, BOOT.current || 0));
  showScene(SCENES[want].build ? want : 0);
}
try { window.claude?.hot?.snapshot?.(() => collectState()); } catch (e) { /* no hot updates here */ }
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

capsReady.then(async () => {
  if (!db) return;
  try {
    const snap = await db.collection("attempts").get();
    snap.docs.forEach(d => {
      const r = d.data();
      if (r.kind !== "prediction") return;
      if (!dbAnswers[r.scene] || r.at > dbAnswers[r.scene].at) dbAnswers[r.scene] = r;
    });
    Object.keys(built).forEach(restoreFromDb);
  } catch (e) { /* records unavailable: the page still works */ }
});
